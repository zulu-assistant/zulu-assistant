<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Conversation · %%BRAND%%</title>
<link rel="stylesheet" href="/style.css">
<style>
  /* one readable column; depth drawn with light only */
  body.cv { padding: 16px 16px 40px; max-width: 820px; margin: 0 auto; font-size: 13px; }
  .cv header { gap: 10px; margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; }
  .cv h1 { font-size: 15px; letter-spacing: .2em; }
  .cv a { color: var(--ink-2); }
  .cv a:hover, .cv a:focus-visible { color: var(--ink-bright); }
  #cv-meta { color: var(--ink-3); font-size: 10px; letter-spacing: .08em; margin-bottom: 10px; }
  .cv-dim { color: var(--ink-3); }
  .cv-list { list-style: none; padding: 0; margin: 0; }
  .cv-entry { background: var(--card); border: 1px solid var(--card-edge); border-radius: 4px; margin-bottom: 8px; padding: 8px 10px; overflow-wrap: anywhere; }
  .cv-entry.cv-user { border-left: 2px solid var(--accent); margin-right: 12%; }
  .cv-entry.cv-agent { margin-left: 4%; }
  .cv-entry.cv-notice { background: transparent; border-style: dashed; color: var(--ink-3); font-size: 11px; }
  .cv-who { font-size: 10px; letter-spacing: .14em; color: var(--ink-2); margin-bottom: 4px; }
  .cv-user .cv-who { color: var(--ink-bright); }
  .cv-text { white-space: pre-wrap; color: var(--ink); line-height: 1.5; }
  .cv-user .cv-text { color: var(--ink-bright); }
  .cv-text + .cv-text, .cv-tools + .cv-text, .cv-tools-fold + .cv-text, .cv-text + .cv-tools, .cv-text + .cv-tools-fold { margin-top: 8px; }
  .cv-tools { list-style: none; padding: 0; margin: 0; font-size: 11px; color: var(--ink-3); }
  .cv-tools li::before { content: '· '; }
  .cv-tool { color: var(--ink-2); }
  .cv-tools-fold summary { cursor: pointer; font-size: 11px; color: var(--ink-3); }
  .cv-tools-fold summary:hover, .cv-tools-fold summary:focus-visible { color: var(--ink-bright); outline: none; }
  @media (max-width: 480px) {
    body.cv { padding: 10px 10px 34px; font-size: 12px; }
    .cv-entry.cv-user { margin-right: 0; } .cv-entry.cv-agent { margin-left: 0; }
  }
</style>
</head>
<body class="cv">
  <header><div class="brand"><span class="brand-mark"></span><h1>CONVERSATION</h1></div><a href="/">← the board</a></header>
  <div id="cv-meta">loading…</div>
  <main id="cv-body"></main>
  <script src="/conversation.js"></script>
</body>
</html>
